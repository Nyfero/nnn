# Phase 1 : `docker compose up -d proxy core-db passwords-db` fonctionne déjà.
# Les services applicatifs (core-*, passwords-*) seront buildables aux phases 2 à 4.
# Le contexte de build est la racine du repo pour pouvoir embarquer packages/ui et packages/sdk.

name: myprout

x-mysql-healthcheck: &mysql-healthcheck
  interval: 5s
  timeout: 5s
  retries: 20

services:
  # ───────────── Proxy ─────────────
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

  # ───────────── Core ─────────────
  core-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CORE_DB_NAME}
      MYSQL_USER: ${CORE_DB_USER}
      MYSQL_PASSWORD: ${CORE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${CORE_DB_ROOT_PASSWORD}
    volumes:
      - core_db_data:/var/lib/mysql
    healthcheck:
      <<: *mysql-healthcheck
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-p${CORE_DB_ROOT_PASSWORD}',
        ]
    networks: [core-internal]

  core-backend:
    build:
      context: .
      dockerfile: core/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      core-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL}
      DB_HOST: core-db
      DB_NAME: ${CORE_DB_NAME}
      DB_USER: ${CORE_DB_USER}
      DB_PASSWORD: ${CORE_DB_PASSWORD}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_FIRSTNAME: ${ADMIN_FIRSTNAME}
      ADMIN_LASTNAME: ${ADMIN_LASTNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MODULE_SECRET_PASSWORDS: ${MODULE_SECRET_PASSWORDS}
      MODULE_SECRET_SERVERS: ${MODULE_SECRET_SERVERS}
      MODULE_SECRET_FILES: ${MODULE_SECRET_FILES}
    volumes:
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/core/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks: [edge, core-internal]

  core-frontend:
    build:
      context: .
      dockerfile: core/frontend/Dockerfile
    restart: unless-stopped
    networks: [edge]

  # ───────────── Module : passwords ─────────────
  passwords-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${PASSWORDS_DB_NAME}
      MYSQL_USER: ${PASSWORDS_DB_USER}
      MYSQL_PASSWORD: ${PASSWORDS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PASSWORDS_DB_ROOT_PASSWORD}
    volumes:
      - passwords_db_data:/var/lib/mysql
    healthcheck:
      <<: *mysql-healthcheck
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-p${PASSWORDS_DB_ROOT_PASSWORD}',
        ]
    networks: [passwords-internal]

  passwords-backend:
    build:
      context: .
      dockerfile: modules/passwords/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      passwords-db:
        condition: service_healthy
      core-backend:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      DB_HOST: passwords-db
      DB_NAME: ${PASSWORDS_DB_NAME}
      DB_USER: ${PASSWORDS_DB_USER}
      DB_PASSWORD: ${PASSWORDS_DB_PASSWORD}
      # Contrat module <-> core
      CORE_URL: http://core-backend:3000
      MODULE_ID: passwords
      MODULE_NAME: Mots de passe
      MODULE_ICON: security
      MODULE_PATH: /passwords
      MODULE_INTERNAL_URL: http://passwords-backend:3000
      MODULE_SECRET: ${MODULE_SECRET_PASSWORDS}
      LOGO_DEV_TOKEN: ${LOGO_DEV_TOKEN}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/passwords/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks: [edge, core-internal, passwords-internal]

  passwords-frontend:
    build:
      context: .
      dockerfile: modules/passwords/frontend/Dockerfile
    restart: unless-stopped
    networks: [edge]

  # ───────────── Module : servers ─────────────
  docker-proxy:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    user: root # nécessaire pour lire le socket Docker
    volumes:
      - ./modules/servers/docker-proxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [servers-docker]

  servers-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${SERVERS_DB_NAME}
      MYSQL_USER: ${SERVERS_DB_USER}
      MYSQL_PASSWORD: ${SERVERS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${SERVERS_DB_ROOT_PASSWORD}
    volumes:
      - servers_db_data:/var/lib/mysql
    healthcheck:
      <<: *mysql-healthcheck
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-p${SERVERS_DB_ROOT_PASSWORD}',
        ]
    networks: [servers-internal]

  servers-backend:
    build:
      context: .
      dockerfile: modules/servers/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      servers-db:
        condition: service_healthy
      core-backend:
        condition: service_started
      docker-proxy:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      DB_HOST: servers-db
      DB_NAME: ${SERVERS_DB_NAME}
      DB_USER: ${SERVERS_DB_USER}
      DB_PASSWORD: ${SERVERS_DB_PASSWORD}
      CORE_URL: http://core-backend:3000
      MODULE_ID: servers
      MODULE_NAME: Serveurs de jeu
      MODULE_ICON: sports_esports
      MODULE_PATH: /servers
      MODULE_INTERNAL_URL: http://servers-backend:3000
      MODULE_SECRET: ${MODULE_SECRET_SERVERS}
      DOCKER_API_URL: http://docker-proxy:2375
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/servers/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks: [edge, core-internal, servers-internal, servers-docker]

  servers-frontend:
    build:
      context: .
      dockerfile: modules/servers/frontend/Dockerfile
    restart: unless-stopped
    networks: [edge]

    # ───────────── Module : files ─────────────
  files-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${FILES_DB_NAME}
      MYSQL_USER: ${FILES_DB_USER}
      MYSQL_PASSWORD: ${FILES_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${FILES_DB_ROOT_PASSWORD}
    volumes:
      - files_db_data:/var/lib/mysql
    healthcheck:
      <<: *mysql-healthcheck
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-p${FILES_DB_ROOT_PASSWORD}',
        ]
    networks: [files-internal]

  files-backend:
    build:
      context: .
      dockerfile: modules/files/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      files-db:
        condition: service_healthy
      core-backend:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      DB_HOST: files-db
      DB_NAME: ${FILES_DB_NAME}
      DB_USER: ${FILES_DB_USER}
      DB_PASSWORD: ${FILES_DB_PASSWORD}
      CORE_URL: http://core-backend:3000
      MODULE_ID: files
      MODULE_NAME: Fichiers
      MODULE_ICON: folder
      MODULE_PATH: /files
      MODULE_INTERNAL_URL: http://files-backend:3000
      MODULE_SECRET: ${MODULE_SECRET_FILES}
      FILES_STORAGE_PATH: /data/files
      FILES_DEFAULT_QUOTA: ${FILES_DEFAULT_QUOTA:-1GB}
      FILES_TRASH_DAYS: ${FILES_TRASH_DAYS:-7}
      FILES_MIN_FREE: ${FILES_MIN_FREE:-1GB}
      FILES_MAX_UPLOAD: ${FILES_MAX_UPLOAD:-}
    volumes:
      - ${FILES_DATA_DIR:-./data/files}:/data/files
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/files/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks: [edge, core-internal, files-internal]

  files-frontend:
    build:
      context: .
      dockerfile: modules/files/frontend/Dockerfile
    restart: unless-stopped
    networks: [edge]

networks:
  # Réseau exposé au proxy
  edge:
  # Le core-backend est joignable par les modules (introspection, enregistrement)
  core-internal:
  # Chaque module a son réseau privé pour sa BDD
  passwords-internal:
  servers-internal:
  servers-docker:
  files-internal:

volumes:
  caddy_data:
  caddy_config:
  core_db_data:
  passwords_db_data:
  servers_db_data:
  files_db_data:
