# Active le mode tests de bout en bout du core (emails capturés en mémoire, rate limit désactivé).
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.e2e.yml up -d --build
# JAMAIS en production : le core refuse de démarrer si E2E_MODE=true avec NODE_ENV=production.
services:
  core-backend:
    environment:
      E2E_MODE: "true"
      E2E_TOKEN: "${E2E_TOKEN:?définir E2E_TOKEN dans .env (openssl rand -hex 16)}"
