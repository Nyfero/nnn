# Proxy Docker filtrant : le module servers-backend n'a PAS accès au socket Docker complet.
# Seules deux requêtes passent, et uniquement sur /containers/<nom> :
#   GET  /containers/<nom>/json
#   POST /containers/<nom>/(start|stop|restart)
# Tout le reste (création de conteneur, exec, volumes, images...) répond 403.
global
    log stdout format raw local0

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 90s
    timeout http-request 10s

frontend docker_in
    bind :2375
    acl inspect_ok method GET  path_reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/json$
    acl action_ok  method POST path_reg ^(/v[0-9.]+)?/containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(start|stop|restart)$
    http-request deny deny_status 403 unless inspect_ok or action_ok
    default_backend docker_sock

backend docker_sock
    server docker /var/run/docker.sock
